    <script>
    let game_type = "IN_GAME",
        url_game = "https://games.yoplay.io/slope-3/",
        check_load_now = "",
        check_referrer = "",
        check_fix = "1";

    const gamePageLoader = document.getElementById("game-page-loader");
    if (gamePageLoader) {
        setTimeout(() => {
            gamePageLoader.remove();
        }, 420);
    }
    document.addEventListener("DOMContentLoaded", function() {
        game_type !== "EXTERNAL" && (check_load_now || game_type === "IFRAME_HTML") && start_game_frame();
    });

    function loading_game(e) {
        const playButton = document.getElementById("btn_play");
        if (playButton) {
            playButton.classList.toggle("PlayButton_clicked__CJRNZ");
        }
        setTimeout(() => {
            start_game_frame();
        }, e * 800);
    }

    function openInNewWindow() {
        const e = window.innerHeight || 600,
            t = window.innerWidth || 600;
        window.open(url_game, "", "width=" + t + ",height=" + e);

        window.parent.postMessage({
            type: "game_play_engaged"
        }, "*");
    }

    function start_game_frame() {
        const frameGame = document.createElement('iframe');
        frameGame.id = "iframehtml5";
        frameGame.width = "100%";
        frameGame.height = "100%";
        frameGame.frameBorder = "0";
        frameGame.style.border = "0";
        frameGame.scrolling = "auto";
        frameGame.className = "iframe-default";
        frameGame.allowFullscreen = true;
        frameGame.src = url_game;
        frameGame.title = "Slope 3";
        if (!check_fix) {
            frameGame.setAttribute("sandbox", "allow-forms allow-modals allow-same-origin allow-scripts allow-pointer-lock allow-orientation-lock allow-presentation allow-downloads");
        }
        if (check_referrer) {
            frameGame.setAttribute('referrerPolicy', 'no-referrer');
        }
        document.body.append(frameGame);

        if (game_type === 'HIDE_FOOTER') {
            document.body.classList.add("hide_footer");
        }
        const preloadGame = document.getElementById("preloading-game");
        if (preloadGame) {
            preloadGame.remove();
        }

        let engagementReady = false;
        let engagementSent = false;

        function sendEngagement() {
            if (engagementReady && !engagementSent && document.visibilityState === "visible") {
                engagementSent = true;

                window.parent.postMessage({
                    type: "game_play_engaged"
                }, "*");
                document.removeEventListener("visibilitychange", sendEngagement);
            }
        }
        setTimeout(function() {
            engagementReady = true;
            sendEngagement();
        }, 3000);
        document.addEventListener("visibilitychange", sendEngagement);
    }
    </script>
